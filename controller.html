<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Family Smash — Controller</title>
<style>
  :root{ --void:#0d1117; --panel:#141c26; --line:#243244; --ink:#e8eef6;
         --dim:#7f93aa; --gold:#ffc94d; --slot:#4cc2ff; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}

  /* ---- join + character screens ---- */
  #join,#pick{align-items:center;justify-content:center;padding:24px;overflow:auto}
  .card{width:min(420px,100%)}
  h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  p.sub{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:20px}
  label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin:16px 0 7px}
  input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:14px}
  input#code{text-transform:uppercase;letter-spacing:.42em;text-align:center;font-size:30px}
  button{font:inherit;font-size:14px;color:var(--ink);background:#1b2634;
    border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
  button.go{width:100%;margin-top:22px;background:var(--gold);border-color:var(--gold);
    color:#101720;font-weight:700;font-size:16px}
  button:disabled{opacity:.5}
  .msg{font-size:12px;color:var(--gold);margin-top:14px;line-height:1.6;min-height:1.2em}
  .chars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .chars button{text-align:left;padding:15px}
  .chars button b{font-size:16px}
  .chars button span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
  .chars button.sel{border-color:var(--gold);background:#252f1f}

  /* ---- the pad ---- */
  #pad{background:#0a0e14}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 14px;
    border-bottom:1px solid var(--line);font-size:12px;flex:none}
  #bar .dot{width:11px;height:11px;border-radius:50%;background:var(--slot);flex:none}
  #bar .who{color:var(--ink)}
  #bar .pct{margin-left:auto;font-size:19px;font-weight:700;color:var(--gold)}
  #bar .stk{color:var(--dim);font-size:12px}
  #bar button{padding:6px 11px;font-size:11px}
  #surface{flex:1;position:relative}
  #stickZone{position:absolute;left:0;top:0;bottom:0;width:48%}
  #stickBase,#stickTop{position:absolute;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);opacity:0;transition:opacity .12s}
  #stickBase{width:34vmin;height:34vmin;background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.14)}
  #stickTop{width:15vmin;height:15vmin;background:var(--slot);opacity:0}
  #stickHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    color:var(--dim);font-size:12px;text-align:center;line-height:1.7;pointer-events:none}
  .btn{position:absolute;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;letter-spacing:.04em;
    background:#1b2634;border:2px solid var(--line);color:var(--ink)}
  .btn.down{background:var(--gold);border-color:var(--gold);color:#101720;transform:scale(.94)}
  .btn.wide{border-radius:16px}
  #bAttack{width:23vmin;height:23vmin;right:6%;bottom:8%}
  #bSpecial{width:19vmin;height:19vmin;right:31%;bottom:14%}
  #bSmash{width:18vmin;height:18vmin;right:11%;bottom:37%}
  #bGrab{width:16vmin;height:16vmin;right:34%;bottom:42%}
  #bJump{width:20vmin;height:20vmin;right:2%;bottom:62%}
  #bShield{width:26vmin;height:12vmin;right:30%;bottom:70%}
</style>
</head>
<body>

<div id="join" class="screen on">
  <div class="card">
    <h1>Family Smash</h1>
    <p class="sub">Get the four-letter code from the screen running the game, then join from here. Stay on the same wifi.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="12" placeholder="Name" autocomplete="off">
    <label for="code">Room code</label>
    <input id="code" maxlength="4" placeholder="----" autocomplete="off"
           autocapitalize="characters" spellcheck="false">
    <button class="go" id="joinBtn">Join</button>
    <div class="msg" id="joinMsg"></div>
  </div>
</div>

<div id="pick" class="screen">
  <div class="card">
    <h1>Pick your fighter</h1>
    <p class="sub" id="pickSub">You're in. Choose who you want to be.</p>
    <div class="chars" id="charList"></div>
  </div>
</div>

<div id="pad" class="screen">
  <div id="bar">
    <span class="dot" id="barDot"></span>
    <span class="who" id="barWho">—</span>
    <span class="stk" id="barStk"></span>
    <span class="pct" id="barPct">0%</span>
    <button id="changeBtn">Change</button>
  </div>
  <div id="surface">
    <div id="stickZone">
      <div id="stickHint">Slide anywhere<br>on this side to move<br><br>Flick up to jump</div>
      <div id="stickBase"></div>
      <div id="stickTop"></div>
    </div>
    <div class="btn" id="bShield">SHIELD</div>
    <div class="btn" id="bJump">JUMP</div>
    <div class="btn" id="bGrab">GRAB</div>
    <div class="btn" id="bSmash">SMASH</div>
    <div class="btn" id="bSpecial">SPECIAL</div>
    <div class="btn" id="bAttack">ATTACK</div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
/* ============================================================
   Phone controller. Talks to the host over a WebRTC data
   channel, so once the handshake is done the presses never
   leave the local network.
   ============================================================ */

const BTN = {jump:1, attack:2, special:4, grab:8, smash:16, shield:32};
const state = {x:0, y:0, b:0};
let conn = null, peer = null, myChar = null, roster = [];

const $ = id => document.getElementById(id);
const show = id => ['join','pick','pad'].forEach(s =>
  $(s).classList.toggle('on', s === id));

/* ---------- joining ---------- */
$('joinBtn').onclick = () => {
  const code = ($('code').value || '').trim().toUpperCase();
  if(code.length !== 4){ $('joinMsg').textContent = 'The code is four letters.'; return; }
  if(typeof Peer === 'undefined'){
    $('joinMsg').textContent = 'Connection library did not load. Check the phone has internet for this first step.';
    return;
  }
  $('joinBtn').disabled = true;
  $('joinMsg').textContent = 'Connecting…';

  peer = new Peer({pingInterval: 4000});
  peer.on('open', () => {
    conn = peer.connect('fsmash-' + code, {reliable: false});
    conn.on('open', () => {
      conn.send({t:'hello', name: ($('name').value || 'Player').trim().slice(0,12)});
      $('joinMsg').textContent = '';
      show('pick');
      startSending();
    });
    conn.on('data', onHostData);
    conn.on('close', dropped);
    conn.on('error', () => fail('Could not reach that room.'));
  });
  peer.on('error', err => {
    const t = err && err.type;
    fail(t === 'peer-unavailable'
      ? 'No room with that code. Check the code on the game screen.'
      : 'Connection problem (' + (t || 'unknown') + ').');
  });
};

function fail(msg){
  $('joinMsg').textContent = msg;
  $('joinBtn').disabled = false;
  try { if(peer) peer.destroy(); } catch(e){}
  peer = null; conn = null;
}
function dropped(){
  show('join');
  $('joinBtn').disabled = false;
  $('joinMsg').textContent = 'Disconnected from the game.';
  conn = null;
}

/* ---------- messages from the host ---------- */
function onHostData(d){
  if(!d) return;
  if(d.t === 'slot'){
    if(d.color){
      document.documentElement.style.setProperty('--slot', d.color);
      $('barDot').style.background = d.color;
    }
    if(d.roster){ roster = d.roster; renderRoster(); }
    if(d.char){
      myChar = d.char;
      const c = roster.find(r => r.key === d.char);
      $('barWho').textContent = (d.slot >= 0 ? 'P' + (d.slot+1) + '  ' : '') +
                                (c ? c.name : d.char);
      renderRoster();
    }
    if(d.slot < 0){
      $('pickSub').textContent = 'Waiting for the host to give you a slot.';
    }
  }
  if(d.t === 'st'){
    $('barPct').textContent = d.pct + '%';
    $('barStk').textContent = '\u25cf'.repeat(Math.max(0, d.stocks));
  }
}

function renderRoster(){
  const list = $('charList');
  list.innerHTML = '';
  roster.forEach(r => {
    const b = document.createElement('button');
    b.innerHTML = '<b>' + r.name + '</b><span>' + (r.blurb || '') + '</span>';
    if(myChar === r.key) b.className = 'sel';
    b.onclick = () => {
      myChar = r.key;
      try { conn.send({t:'char', key: r.key}); } catch(e){}
      renderRoster();
      show('pad');
    };
    list.appendChild(b);
  });
}
$('changeBtn').onclick = () => show('pick');

/* ---------- the stick ---------- */
const zone = $('stickZone'), base = $('stickBase'), top = $('stickTop');
let stickId = null, originX = 0, originY = 0;
const RADIUS = () => Math.min(innerWidth, innerHeight) * 0.17;

zone.addEventListener('pointerdown', e => {
  if(stickId !== null) return;
  stickId = e.pointerId;
  zone.setPointerCapture(e.pointerId);
  const r = zone.getBoundingClientRect();
  originX = e.clientX - r.left; originY = e.clientY - r.top;
  base.style.left = top.style.left = originX + 'px';
  base.style.top  = top.style.top  = originY + 'px';
  base.style.opacity = 1; top.style.opacity = 1;
  $('stickHint').style.opacity = 0;
  moveStick(e);
});
zone.addEventListener('pointermove', e => { if(e.pointerId === stickId) moveStick(e); });
function endStick(e){
  if(e.pointerId !== stickId) return;
  stickId = null;
  state.x = 0; state.y = 0;
  base.style.opacity = 0; top.style.opacity = 0;
  $('stickHint').style.opacity = 1;
}
zone.addEventListener('pointerup', endStick);
zone.addEventListener('pointercancel', endStick);

function moveStick(e){
  const r = zone.getBoundingClientRect();
  let dx = (e.clientX - r.left) - originX;
  let dy = (e.clientY - r.top) - originY;
  const rad = RADIUS();
  const mag = Math.hypot(dx, dy);
  if(mag > rad){ dx = dx/mag*rad; dy = dy/mag*rad; }
  top.style.left = (originX + dx) + 'px';
  top.style.top  = (originY + dy) + 'px';
  // A small dead zone, then a slightly eased ramp so light touches
  // walk and full pushes run.
  const nx = dx/rad, ny = dy/rad;
  state.x = Math.abs(nx) < 0.16 ? 0 : Math.max(-1, Math.min(1, nx * 1.25));
  state.y = Math.abs(ny) < 0.16 ? 0 : Math.max(-1, Math.min(1, ny * 1.25));
}

/* ---------- the buttons ---------- */
function wire(id, bit){
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    state.b |= bit;
    el.classList.add('down');
    if(navigator.vibrate) navigator.vibrate(8);
  });
  const up = () => { state.b &= ~bit; el.classList.remove('down'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
wire('bAttack', BTN.attack);
wire('bSpecial', BTN.special);
wire('bSmash', BTN.smash);
wire('bGrab', BTN.grab);
wire('bJump', BTN.jump);
wire('bShield', BTN.shield);

/* ---------- send loop ---------- */
function startSending(){
  let lastSent = 0, last = '';
  const tick = () => {
    if(conn && conn.open){
      const now = performance.now();
      const packed = state.x.toFixed(2) + ',' + state.y.toFixed(2) + ',' + state.b;
      // send on change, plus a heartbeat so a dropped packet can't stick a button
      if(packed !== last || now - lastSent > 100){
        try { conn.send({t:'in', x: state.x, y: state.y, b: state.b}); } catch(e){}
        last = packed; lastSent = now;
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// keep the phone awake if the browser allows it
if('wakeLock' in navigator){
  navigator.wakeLock.request('screen').catch(()=>{});
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(()=>{});
  });
}
$('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });

// A link like .../controller.html#ABCD arrives with the room already filled in.
(function fromLink(){
  const raw = (location.hash || location.search || '').replace(/[^A-Za-z0-9]/g, '');
  const code = raw.toUpperCase().slice(0, 4);
  if(code.length === 4){
    $('code').value = code;
    $('joinBtn').textContent = 'Join room ' + code;
    $('name').focus();
  }
})();
</script>
</body>
</html>
